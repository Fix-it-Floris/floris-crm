name: Floris CRM Automation
 
on:
  schedule:
    # ── Daily leads: weekdays 09:00 Amsterdam ─────────────────────────────────
    # Amsterdam is UTC+1 (CET, winter) / UTC+2 (CEST, summer)
    # 07:00 UTC = 09:00 CEST (summer, Mar–Oct) — most of the working year
    # 08:00 UTC = 09:00 CET  (winter, Oct–Mar) — update cron line in winter if needed
    - cron: '0 7 * * 1-5'
 
    # ── Follow-up checker: weekdays 09:05 Amsterdam ───────────────────────────
    - cron: '5 7 * * 1-5'
 
    # ── Weekly digest: every Friday 09:10 Amsterdam ───────────────────────────
    - cron: '10 7 * * 5'
 
  # Manual trigger from GitHub Actions tab (useful for testing)
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run manually?'
        required: true
        default: 'daily_leads'
        type: choice
        options:
          - daily_leads
          - followup_checker
          - weekly_digest
 
jobs:
 
  # ── Job 1: Daily leads ──────────────────────────────────────────────────────
  daily-leads:
    name: Daily lead finder
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 7 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily_leads')
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install anthropic
 
      - name: Run daily lead finder
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          STOP_SERVICE:       ${{ secrets.STOP_SERVICE }}
        run: python scripts/daily_leads.py
 
 
  # ── Job 2: Follow-up checker ────────────────────────────────────────────────
  followup-checker:
    name: Follow-up checker
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '5 7 * * 1-5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'followup_checker')
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install anthropic
 
      - name: Run follow-up checker
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          STOP_SERVICE:       ${{ secrets.STOP_SERVICE }}
          FOLLOWUP_DAYS:      "14"
        run: python scripts/followup_checker.py
 
 
  # ── Job 3: Weekly digest ────────────────────────────────────────────────────
  weekly-digest:
    name: Weekly digest
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '10 7 * * 5') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly_digest')
 
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      - name: Install dependencies
        run: pip install anthropic
 
      - name: Run weekly digest
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          EMAIL_SENDER:       ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD:     ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT:    ${{ secrets.EMAIL_RECIPIENT }}
          STOP_SERVICE:       ${{ secrets.STOP_SERVICE }}
        run: python scripts/weekly_digest.py
